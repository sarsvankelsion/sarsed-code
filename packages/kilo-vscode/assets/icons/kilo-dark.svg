<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="72" y1="45" x2="440" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#990022"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="100" y1="75" x2="412" y2="435" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF2A55" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Shield with Glow -->
  <polygon points="256,45 440,115 440,275 256,465 72,275 72,115" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <!-- Inner Shield -->
  <polygon points="256,75 412,135 412,265 256,435 100,265 100,135" fill="url(#innerGrad)"/>
  <!-- Geometric S Monogram -->
  <polygon points="160,160 352,160 352,220 235,220 235,250 352,290 352,355 160,355 160,295 277,295 277,265 160,225" fill="#FFFFFF"/>
  <!-- Cyber Red Accents -->
  <polygon points="270,160 352,160 352,220 270,220" fill="#FF2A55"/>
  <polygon points="160,295 242,295 242,355 160,355" fill="#FF2A55"/>
</svg>
