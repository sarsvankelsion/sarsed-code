<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradLight" x1="72" y1="45" x2="440" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="innerGradLight" x1="100" y1="75" x2="412" y2="435" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <polygon points="256,45 440,115 440,275 256,465 72,275 72,115" fill="url(#shieldGradLight)" filter="url(#glowLight)"/>
  <!-- Inner Shield -->
  <polygon points="256,75 412,135 412,265 256,435 100,265 100,135" fill="url(#innerGradLight)"/>
  <!-- Geometric S Monogram -->
  <polygon points="160,160 352,160 352,220 235,220 235,250 352,290 352,355 160,355 160,295 277,295 277,265 160,225" fill="#0F172A"/>
  <!-- Crimson Accents -->
  <polygon points="270,160 352,160 352,220 270,220" fill="#E11D48"/>
  <polygon points="160,295 242,295 242,355 160,355" fill="#E11D48"/>
</svg>
